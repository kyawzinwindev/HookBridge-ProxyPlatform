/* ---------- State ---------- */
let selectedId = EVENTS[0].id;
let activeTab = 'body';
let filterText = '';

/* ---------- Helpers ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function statusBadge(status, small) {
  const base = small
    ? 'inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-semibold font-mono border '
    : 'inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-semibold font-mono border ';
  let cls, label;
  if (status >= 200 && status < 300) {
    cls = 'bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border-emerald-500/30'; label = status + ' OK';
  } else if (status >= 500) {
    cls = 'bg-rose-500/10 text-rose-700 dark:text-rose-400 border-rose-500/30'; label = status + ' Error';
  } else {
    cls = 'bg-amber-400/10 text-amber-700 dark:text-amber-400 border-amber-400/30'; label = status + ' Warn';
  }
  return `<span class="${base}${cls}">${label}</span>`;
}

function renderJSON(value, indent = 0) {
  const pad = '  '.repeat(indent);
  const padIn = '  '.repeat(indent + 1);
  if (value === null) return '<span class="j-null">null</span>';
  if (typeof value === 'string') return `<span class="j-str">"${esc(value)}"</span>`;
  if (typeof value === 'number') return `<span class="j-num">${value}</span>`;
  if (typeof value === 'boolean') return `<span class="j-bool">${value}</span>`;
  if (Array.isArray(value)) {
    if (!value.length) return '<span class="j-punc">[]</span>';
    const items = value.map(v => padIn + renderJSON(v, indent + 1));
    return '<span class="j-punc">[</span>\n' + items.join('<span class="j-punc">,</span>\n') + '\n' + pad + '<span class="j-punc">]</span>';
  }
  const keys = Object.keys(value);
  if (!keys.length) return '<span class="j-punc">{}</span>';
  const items = keys.map(k => `${padIn}<span class="j-key">"${esc(k)}"</span><span class="j-punc">:</span> ${renderJSON(value[k], indent + 1)}`);
  return '<span class="j-punc">{</span>\n' + items.join('<span class="j-punc">,</span>\n') + '\n' + pad + '<span class="j-punc">}</span>';
}

function codeBlock(html) {
  const lines = html.split('\n');
  const nums = lines.map((_, i) => i + 1).join('\n');
  return `
    <div class="flex font-mono text-[13px] leading-6 min-h-full">
      <pre class="line-num shrink-0 text-right px-3 py-3 text-zinc-400 dark:text-zinc-600 border-r border-zinc-200 dark:border-zinc-800 select-none">${nums}</pre>
      <pre class="flex-1 px-4 py-3 text-zinc-800 dark:text-zinc-200 whitespace-pre overflow-visible">${html}</pre>
    </div>`;
}

/* ---------- Render: list ---------- */

  if (!items.length) {
    list.innerHTML = `<div class="text-center text-xs text-zinc-500 py-10">No events match your filter.</div>`;
    return;
  }

  list.innerHTML = items.map(e => {
    const active = e.id === selectedId;
    const cls = active
      ? 'border-zinc-900 dark:border-zinc-100 bg-zinc-50 dark:bg-zinc-900 ring-1 ring-zinc-900 dark:ring-zinc-100'

      <button data-id="${e.id}" class="event-card w-full text-left rounded-lg border px-3 py-2.5 transition-colors ${cls}">
        <div class="flex items-center justify-between gap-2">
          <span class="font-mono text-[13px] font-medium truncate">${esc(e.name)}</span>

        </div>

          <span class="font-mono text-[10px] font-semibold px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400">${e.method}</span>
          ${statusBadge(e.status, true)}
          <span class="ml-auto font-mono text-[11px] text-zinc-500">${e.latency}ms</span>
        </div>
      </button>`;
  }).join('');

  list.querySelectorAll('.event-card').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedId = btn.dataset.id;
      renderList();
      renderDetail();
    });
  });
}

/* ---------- Render: detail ---------- */
function renderDetail() {
  const e = EVENTS.find(x => x.id === selectedId) || EVENTS[0];

  document.getElementById('detailId').textContent = e.id;
  document.getElementById('detailMethod').textContent = e.method;
  document.getElementById('detailPath').textContent = e.path;
  document.getElementById('detailStatusBadge').innerHTML = statusBadge(e.status, false);

  // tabs
  document.querySelectorAll('.tab-btn').forEach(b => {
    const on = b.dataset.tab === activeTab;
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.classList.toggle('text-zinc-900', on);
    b.classList.toggle('dark:text-zinc-100', on);
    b.classList.toggle('text-zinc-500', !on);
  });

  const content = document.getElementById('tabContent');
  const label = document.getElementById('paneLabel');
  const meta = document.getElementById('paneMeta');

  if (activeTab === 'body') {
    label.textContent = 'application/json';
    const json = JSON.stringify(e.body);
    meta.textContent = new Blob([json]).size + ' bytes';
    content.innerHTML = codeBlock(renderJSON(e.body));
  } else if (activeTab === 'headers') {
    label.textContent = 'Request headers';
    meta.textContent = Object.keys(e.headers).length + ' headers';
    const rows = Object.entries(e.headers).map(([k, v]) => `
      <tr class="border-b border-zinc-200 dark:border-zinc-800 last:border-0">
        <td class="px-4 py-2 font-mono text-[13px] text-zinc-500 dark:text-zinc-400 align-top whitespace-nowrap">${esc(k)}</td>
        <td class="px-4 py-2 font-mono text-[13px] text-zinc-800 dark:text-zinc-200 break-all">${esc(v)}</td>
      </tr>`).join('');
    content.innerHTML = `<table class="w-full">${rows}</table>`;
  } else {
    const r = e.response;
    label.textContent = 'Local response';
    meta.textContent = `${r.status} ${r.statusText} · ${r.time}`;
    const hdrs = Object.entries(r.headers).map(([k, v]) => `
      <tr class="border-b border-zinc-200 dark:border-zinc-800 last:border-0">
        <td class="px-4 py-1.5 font-mono text-[13px] text-zinc-500 dark:text-zinc-400 whitespace-nowrap">${esc(k)}</td>
        <td class="px-4 py-1.5 font-mono text-[13px] text-zinc-800 dark:text-zinc-200 break-all">${esc(v)}</td>
      </tr>`).join('');
    content.innerHTML = `
      <div class="px-4 pt-3 pb-2 flex items-center gap-2">
        ${statusBadge(r.status, false)}
        <span class="text-xs text-zinc-500">${esc(r.statusText)} · ${r.time}</span>
      </div>
      <div class="px-4 pb-1 text-[11px] uppercase tracking-wider text-zinc-500">Headers</div>
      <table class="w-full mb-2">${hdrs}</table>
      <div class="px-4 pt-2 pb-1 text-[11px] uppercase tracking-wider text-zinc-500 border-t border-zinc-200 dark:border-zinc-800">Body</div>
      ${codeBlock(renderJSON(r.body))}`;
  }

  // delivery pill
  const pill = document.getElementById('deliveryPill');
  if (e.status >= 200 && e.status < 300) {
    pill.className = 'flex items-center gap-2.5 h-9 px-3 rounded-md border text-xs border-emerald-500/30 bg-emerald-500/10 text-emerald-800 dark:text-emerald-300';
    pill.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span>
      <span class="truncate">Forwarded to <span class="font-mono">${esc(e.forwarded)}</span> — <span class="font-semibold">${e.status} OK</span> in ${e.latency}ms</span>`;
  } else {
    pill.className = 'flex items-center gap-2.5 h-9 px-3 rounded-md border text-xs border-rose-500/30 bg-rose-500/10 text-rose-800 dark:text-rose-300';
    pill.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-500 shrink-0"></span>
      <span class="truncate">Forwarded to <span class="font-mono">${esc(e.forwarded)}</span> — <span class="font-semibold">${e.status} Error</span> in ${e.latency}ms</span>`;
  }
}

/* ---------- Interactions ---------- */
document.querySelectorAll('.tab-btn').forEach(b => {
  b.addEventListener('click', () => { activeTab = b.dataset.tab; renderDetail(); });
});

document.getElementById('searchInput').addEventListener('input', ev => {
  filterText = ev.target.value;
  renderList();
});
document.getElementById('clearBtn').addEventListener('click', () => {
  filterText = '';
  document.getElementById('searchInput').value = '';
  renderList();
});

function flash(btn, text) {
  const orig = btn.textContent;
  btn.textContent = text;
  setTimeout(() => { btn.textContent = orig; }, 1200);
}
document.getElementById('copyUrlBtn').addEventListener('click', ev => {
  try { navigator.clipboard.writeText(document.getElementById('ingestUrl').textContent); } catch (_) {}
  flash(ev.currentTarget, 'Copied');
});
document.getElementById('copyCurlBtn').addEventListener('click', ev => {
  const e = EVENTS.find(x => x.id === selectedId);
  const curl = `curl -X ${e.method} 'http://localhost:3000${e.path.replace('/in/wh_live_99x','/webhooks')}' \\\n` +
    Object.entries(e.headers).filter(([k]) => k !== 'Host' && k !== 'Content-Length')
      .map(([k, v]) => `  -H '${k}: ${v}'`).join(' \\\n') +
    ` \\\n  -d '${JSON.stringify(e.body)}'`;
  try { navigator.clipboard.writeText(curl); } catch (_) {}
  flash(ev.currentTarget, 'Copied');
});
document.getElementById('replayBtn').addEventListener('click', ev => {
  const btn = ev.currentTarget;
  const orig = btn.innerHTML;
  btn.innerHTML = 'Replayed ✓';
  setTimeout(() => { btn.innerHTML = orig; }, 1200);
});

/* ---------- Theme toggle ---------- */
const root = document.documentElement;
try {
  const saved = localStorage.getItem('hookbridge-theme');
  if (saved === 'light') root.classList.remove('dark');
} catch (_) {}
document.getElementById('themeToggle').addEventListener('click', () => {
  root.classList.toggle('dark');
  try { localStorage.setItem('hookbridge-theme', root.classList.contains('dark') ? 'dark' : 'light'); } catch (_) {}
});

/* ---------- Init ---------- */
renderList();
renderDetail();
</script>
</body>
</html>
